name: Build and publish Tealeaf

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  # Required by the shared Maven publication workflow.
  packages: write
  # Required to publish SpotBugs SARIF to code scanning.
  security-events: write

concurrency:
  group: tealeaf-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    # The private registry and browser-equipped runners are for trusted branches.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, instanto-container]
    timeout-minutes: 60
    env:
      FORGEJO_PACKAGE_USER: ${{ secrets.FORGEJO_PACKAGE_USER }}
      FORGEJO_PACKAGE_TOKEN: ${{ secrets.FORGEJO_PACKAGE_TOKEN || secrets.FORGEJO_PACKAGES_TOKEN || secrets.FORGEJO_PACKAGE_READ_TOKEN }}
      # Download the browser revisions selected by the project's Playwright dependency.
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '0'
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          overwrite-settings: false
      - name: Allocate job-local browser cache
        run: echo "PLAYWRIGHT_BROWSERS_PATH=$RUNNER_TEMP/tealeaf-browsers-${{ github.run_id }}-${{ github.run_attempt }}" >> "$GITHUB_ENV"
      - name: Verify the complete reactor and Chromium/WebKit contracts
        run: >-
          mvn --settings .github/maven-settings.xml --batch-mode --no-transfer-progress
          --update-snapshots
          -Dmaven.repo.local="$RUNNER_TEMP/tealeaf-m2-${{ github.run_id }}-${{ github.run_attempt }}"
          clean verify
      - name: Verify with TeaCoCo browser coverage
        # The ordinary build above already proved the shipped bundle. This run
        # instruments the same application so Sonar sees the library lines the
        # Playwright contracts actually execute.
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && env.SONAR_TOKEN != ''
        run: >-
          mvn --settings .github/maven-settings.xml --batch-mode --no-transfer-progress
          --update-snapshots
          -Dmaven.repo.local="$RUNNER_TEMP/tealeaf-m2-${{ github.run_id }}-${{ github.run_attempt }}"
          -Pcoverage
          -Dteavm.coverage.enabled=true
          -Dteavm.coverage.mode=lines
          -Dteavm.coverage.sourceRoots="$PWD/leaflet-compat/src/main/java"
          -Dteavm.coverage.dataDirectory="$PWD/leaflet-demo/target/teavm-coverage"
          -Dteavm.incremental=false
          clean verify
      - name: SonarQube analysis
        # Analysis belongs to the default branch only: a pull-request run would
        # otherwise replace the project's main analysis with unmerged code.
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && env.SONAR_TOKEN != ''
        continue-on-error: true
        env:
          SONAR_HOST_URL: https://sonar.instanto.io
        run: >-
          mvn --settings .github/maven-settings.xml --batch-mode --no-transfer-progress
          -Dmaven.repo.local="$RUNNER_TEMP/tealeaf-m2-${{ github.run_id }}-${{ github.run_attempt }}"
          sonar:sonar -Dsonar.projectKey=tealeaf -Dsonar.projectName=tealeaf
          -Dsonar.coverageReportPaths="$PWD/leaflet-demo/target/teavm-coverage.xml"
          -Dsonar.qualitygate.wait=true
      - name: Publish quality summary
        if: always()
        continue-on-error: true
        uses: instanto-io/instanto-poms/.github/actions/quality-summary@main
        with:
          sonar-project-key: tealeaf
          sonar-token: ${{ secrets.SONAR_READ_TOKEN || secrets.SONAR_TOKEN }}
      - name: Upload SpotBugs reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: spotbugs-reports
          path: '**/target/spotbugs/'
          if-no-files-found: ignore
          retention-days: 7
      - name: Show browser test failures
        if: failure()
        run: |
          find leaflet-demo/target/failsafe-reports leaflet-gwt-demo/target/failsafe-reports -name '*.txt' -exec cat {} + 2>/dev/null || true
      - name: Remove job-local caches
        if: always()
        run: rm -rf -- "$RUNNER_TEMP/tealeaf-m2-${{ github.run_id }}-${{ github.run_attempt }}" "$PLAYWRIGHT_BROWSERS_PATH"

  publish-snapshot:
    # Verification and deployment use the same workflow commit. Manual main runs
    # also verify first; there is no ungated publication-only dispatch.
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: verify
    uses: instanto-io/instanto-poms/.github/workflows/maven-build.yml@main
    with:
      name: Publish Tealeaf snapshots to packages.instanto.io
      goals: clean deploy
      maven-args: -DskipTests
      timeout-minutes: 60
    secrets: inherit
